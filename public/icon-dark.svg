<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1a"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="vol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#cfe9ff"/>
      <stop offset="1" stop-color="#8fb8e6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a6b"/>
      <stop offset="1" stop-color="#232c4d"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- layer 3: deepest shadow -->
  <text x="33.5" y="43" font-family="Nunito, Verdana, system-ui, sans-serif" font-size="36" font-weight="800" fill="#0c0f1c" text-anchor="middle">SL</text>
  <!-- layer 2: volume edge (offset light) -->
  <text x="34.5" y="42.5" font-family="Nunito, Verdana, system-ui, sans-serif" font-size="36" font-weight="800" fill="url(#edge)" text-anchor="middle">SL</text>
  <!-- layer 1: offset right/down creates depth -->
  <text x="35.5" y="41.5" font-family="Nunito, Verdana, system-ui, sans-serif" font-size="36" font-weight="800" fill="#5a6f9e" text-anchor="middle">SL</text>
  <!-- main glossy top -->
  <text x="34" y="41" font-family="Nunito, Verdana, system-ui, sans-serif" font-size="36" font-weight="800" fill="url(#vol)" stroke="#ffffff" stroke-width="0.5" text-anchor="middle">SL</text>
</svg>
